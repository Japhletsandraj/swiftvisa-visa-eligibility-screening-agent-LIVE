# Example Streamlit Secrets (TOML)
# Copy these keys into the Streamlit Secrets editor (Settings → Secrets) or
# use this as a template for your local deployment (do NOT commit .env).

# Replace the placeholder values with your real keys before deploying.
CHATANYWHERE_API_KEY = "sk-REPLACE_WITH_YOUR_KEY"
CHATANYWHERE_BASE_URL = "https://api.chatanywhere.org/v1"
CHATANYWHERE_MODEL = "gpt-4o-mini"
CHATANYWHERE_TEMPERATURE = "0.3"
CHATANYWHERE_MAX_TOKENS = "800"
